<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>あなたに合う副業診断</title>
<style>
  :root{
    --bg:#0f172a;
    --card:#ffffff;
    --accent:#2563eb;
    --accent-dark:#1e40af;
    --text:#1e293b;
    --muted:#64748b;
    --bar-bg:#e2e8f0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:linear-gradient(160deg,#0f172a,#1e3a8a);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:32px 16px;
  }
  .app{
    width:100%;
    max-width:560px;
    background:var(--card);
    border-radius:16px;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
    overflow:hidden;
  }
  .header{
    padding:28px 24px 20px;
    text-align:center;
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));
    color:#fff;
  }
  .header h1{
    margin:0 0 6px;
    font-size:1.35rem;
  }
  .header p{
    margin:0;
    font-size:0.85rem;
    opacity:0.9;
  }
  .progress-wrap{
    padding:16px 24px 0;
  }
  .progress-bar{
    height:8px;
    background:var(--bar-bg);
    border-radius:999px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    width:0%;
    transition:width .35s ease;
  }
  .progress-label{
    font-size:0.75rem;
    color:var(--muted);
    margin-top:6px;
    text-align:right;
  }
  .body{
    padding:20px 24px 28px;
  }
  .question{
    font-size:1.05rem;
    font-weight:700;
    color:var(--text);
    margin:6px 0 18px;
    line-height:1.5;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .option-btn{
    text-align:left;
    padding:14px 16px;
    border:2px solid #e2e8f0;
    background:#f8fafc;
    border-radius:10px;
    font-size:0.95rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
  }
  .option-btn:hover{
    border-color:var(--accent);
    background:#eff6ff;
  }
  .nav-row{
    display:flex;
    justify-content:space-between;
    margin-top:20px;
  }
  .back-btn{
    background:none;
    border:none;
    color:var(--muted);
    font-size:0.85rem;
    cursor:pointer;
    padding:8px 4px;
  }
  .back-btn:disabled{
    visibility:hidden;
  }
  .back-btn:hover{
    color:var(--accent);
  }
  /* 結果画面 */
  .result{
    text-align:center;
  }
  .result-badge{
    display:inline-block;
    background:#eff6ff;
    color:var(--accent-dark);
    font-size:0.8rem;
    font-weight:700;
    padding:4px 14px;
    border-radius:999px;
    margin-bottom:12px;
  }
  .result h2{
    font-size:1.5rem;
    margin:0 0 8px;
    color:var(--text);
  }
  .result .match{
    font-size:0.9rem;
    color:var(--accent-dark);
    font-weight:700;
    margin-bottom:18px;
  }
  .result-desc{
    text-align:left;
    background:#f8fafc;
    border-radius:12px;
    padding:18px;
    font-size:0.92rem;
    line-height:1.7;
    color:var(--text);
    margin-bottom:20px;
  }
  .result-desc strong{
    color:var(--accent-dark);
  }
  .cta-note{
    font-size:0.88rem;
    font-weight:700;
    color:var(--accent-dark);
    background:#eff6ff;
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:10px;
    line-height:1.5;
  }
  .cta-btn{
    display:inline-block;
    width:100%;
    padding:16px;
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(37,99,235,0.35);
  }
  .second-pick{
    text-align:left;
    border:2px dashed #c7d2fe;
    background:#eef2ff;
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:20px;
  }
  .second-pick-label{
    display:inline-block;
    font-size:0.72rem;
    font-weight:700;
    color:#4338ca;
    background:#e0e7ff;
    padding:3px 10px;
    border-radius:999px;
    margin-bottom:8px;
  }
  .second-pick h3{
    margin:0 0 8px;
    font-size:1.05rem;
    color:var(--text);
  }
  .second-pick p{
    margin:0;
    font-size:0.86rem;
    line-height:1.6;
    color:var(--text);
  }
  .second-pick strong{
    color:#4338ca;
  }
  .line-share-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    padding:14px;
    margin-top:10px;
    background:#06C755;
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:0.95rem;
    font-weight:700;
    cursor:pointer;
  }
  .line-share-btn svg{
    width:18px;
    height:18px;
    flex-shrink:0;
  }
  .retry-link{
    display:block;
    margin-top:14px;
    font-size:0.82rem;
    color:var(--muted);
    text-decoration:underline;
    cursor:pointer;
    background:none;
    border:none;
  }
  .hidden{display:none;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>あなたに合う副業診断</h1>
    <p>10個の質問に答えるだけ。あなたにピッタリの副業タイプがわかります。</p>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">質問 1 / 10</div>
  </div>

  <div class="body">
    <div id="quizScreen">
      <div class="question" id="questionText"></div>
      <div class="options" id="optionsWrap"></div>
      <div class="nav-row">
        <button class="back-btn" id="backBtn">← 前の質問に戻る</button>
      </div>
    </div>

    <div id="resultScreen" class="result hidden">
      <div class="result-badge">診断結果</div>
      <h2 id="resultTitle"></h2>
      <div class="match" id="resultMatch"></div>
      <div class="result-desc" id="resultDesc"></div>
      <div class="second-pick" id="secondPick">
        <span class="second-pick-label">第2候補</span>
        <h3 id="secondPickTitle"></h3>
        <p id="secondPickDesc"></p>
      </div>
      <p class="cta-note">📩 LINE追加したら、この副業についての詳しい情報が無料で手に入るよ！</p>
      <button class="cta-btn" id="ctaBtn">LINE追加して詳しく見る</button>
      <button class="line-share-btn" id="lineShareBtn">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2C6.48 2 2 5.94 2 10.76c0 4.32 3.6 7.94 8.46 8.63.33.07.78.22.89.51.1.26.06.67.03.93l-.14 1c-.04.26-.2 1.03.9.56 1.1-.47 5.94-3.5 8.1-6 1.5-1.65 2.26-3.33 2.26-5.63C22.5 5.94 17.52 2 12 2z"/></svg>
        診断結果をLINEでシェアする
      </button>
      <button class="retry-link" id="retryBtn">もう一度診断する</button>
    </div>
  </div>
</div>

<script>
/*
  スコア方式:
  各選択肢が複数の副業タイプにスコアを加算する。
  CADとブログ・アフィリエイトには基礎加点(バイアス)を与え、
  出やすさの優先順位「CAD > ブログ・アフィリエイト > その他」を実現する。
*/

const TYPES = {
  cad: {
    title: "CAD副業タイプ",
    match: "あなたにぴったりの副業は「CAD（図面作成・製図代行）」です！",
    desc: `<strong>コツコツ丁寧な作業が得意</strong>で、<strong>専門スキルを積み上げたいタイプ</strong>です。
    「CAD」と聞くと難しそうに感じるかもしれませんが、いきなり図面を書く必要はありません。
    まずは図面の中の<strong>丸の数を数えて数量をまとめる「積算」のような、覚えることが少なく取り組みやすい作業</strong>からスタートできます。
    そこから少しずつ製図の作業に慣れていけば、建築・機械・電気などの図面作成案件を在宅で受注できるようになり、
    未経験からでも単価が伸びやすい将来性のある副業です。`
  },
  blog: {
    title: "ブログ・アフィリエイトタイプ",
    match: "あなたにぴったりの副業は「ブログ・アフィリエイト」です！",
    desc: `<strong>自分のペースでコツコツ資産を積み上げたいタイプ</strong>です。
    最初は成果が出るまで時間がかかりますが、記事という資産を積み上げることで、
    将来的に自動的に収益が発生する仕組みを作れます。
    文章を書くことや情報を調べることが好きなあなたに向いています。`
  },
  sedori: {
    title: "せどり（物販）タイプ",
    match: "あなたの回答は「せどり・物販」に近い傾向でした",
    desc: `せどりは<strong>売れなければ在庫として残ってしまうリスクが大きい</strong>副業です。
    在庫を抱えると部屋が荒れやすくなり、保管や仕入れにお金もかかります。
    始める場合は、売れる見込みが立つ商品だけを扱う、リサーチ力が特に重要になります。`
  },
  invest: {
    title: "投資タイプ",
    match: "あなたの回答は「投資（株・FX・仮想通貨など）」に近い傾向でした",
    desc: `投資は<strong>大きい金額を動かせる人ほど有利</strong>になりやすい副業です。
    まずは<strong>NISAの非課税枠を使い切ってから</strong>、追加の投資を検討するのがおすすめです。
    まとまった資金がまだない場合は、他の副業で資金を作ってから始めるのも一つの方法です。`
  },
  sns: {
    title: "SNS運用代行タイプ",
    match: "あなたの回答は「SNS運用代行」に近い傾向でした",
    desc: `SNS運用代行は<strong>自分自身のSNSで実績（例：フォロワー1万人超えなど）がある人</strong>ほど信頼されやすく、案件を獲得しやすい副業です。
    また、クライアントの投稿スケジュールに合わせて動くため、<strong>締め切りに追われる働き方が苦にならない人</strong>に向いています。
    実績や経験がまだない場合は、まず自分のアカウントを育てるところから始めるのがおすすめです。`
  },
  video: {
    title: "動画編集タイプ",
    match: "あなたの回答は「動画編集」に近い傾向でした",
    desc: `動画編集は<strong>単価が低めで、時給換算すると良くても2,500円程度</strong>までになりやすい副業です。
    需要自体はあるため仕事は見つけやすいですが、他の人より安い単価・時給で働き続ける覚悟が必要になる場面もあります。
    それでも<strong>編集作業そのものが好き</strong>であれば、続けやすく向いている副業と言えます。`
  },
  program: {
    title: "プログラミングタイプ",
    match: "あなたの回答は「プログラミング（受託・Web制作）」に近い傾向でした",
    desc: `プログラミングは、コードを書けるAIが増えてきたことで<strong>単純な実装だけでは需要が減りつつある</strong>分野です。
    今後はAIを使いこなす側、つまり<strong>AIより上手にコードを書ける・使いこなせる人材</strong>であり続ける必要があります。
    とはいえ需要が尽きることはない分野なので、<strong>すでに知識がある人</strong>にはおすすめできる副業です。`
  },
  writing: {
    title: "ライティング・軽作業タイプ",
    match: "あなたの回答は「Webライティング・クラウドソーシング軽作業」に近い傾向でした",
    desc: `Webライティングやデータ入力などの軽作業は、始めやすい反面<strong>単価が低く、あまり稼げない</strong>副業です。
    正直なところ、あまりおすすめはできません。
    もし始めるなら、あくまで他のスキルを身につけるまでの「つなぎ」として考えるのがよいでしょう。`
  }
};

/*
  各タイプが選択肢として登場する回数を8タイプ×5回で揃え、
  1回選択したときの加点も一律3点にすることで「素の最大到達点」を全タイプ15点で統一。
  その上でCAD/ブログにのみ小さめの基礎バイアスを乗せ、
  「出やすさ: CAD > ブログ・アフィリエイト > その他」を、
  他タイプが明確に選ばれたときにはそちらが勝てる範囲で実現する。
*/
const QUESTIONS = [
  {
    q: "Q1. 副業に一番求めるものは？",
    options: [
      { text: "専門スキルを身につけて長く稼げるようになりたい", scores: {cad:3} },
      { text: "自分の発信や記事を資産として積み上げたい", scores: {blog:3} },
      { text: "仕入れて売る、シンプルな仕組みで稼ぎたい", scores: {sedori:3} },
      { text: "お金を運用して増やす力を身につけたい", scores: {invest:3} }
    ]
  },
  {
    q: "Q2. 得意・興味がある作業は？",
    options: [
      { text: "SNSでの発信やコミュニケーション", scores: {sns:3} },
      { text: "動画編集などのクリエイティブ作業", scores: {video:3} },
      { text: "パソコンでの論理的なものづくり（プログラミング等）", scores: {program:3} },
      { text: "文章入力やリサーチなどコツコツ作業", scores: {writing:3} }
    ]
  },
  {
    q: "Q3. これまで興味を持ったことがあるものは？",
    options: [
      { text: "設計図やものづくり、建築・機械系の話", scores: {cad:3} },
      { text: "ブログやSNSでの情報発信", scores: {blog:3} },
      { text: "SNSのトレンドやバズっている投稿", scores: {sns:3} },
      { text: "YouTubeなどの動画コンテンツ", scores: {video:3} }
    ]
  },
  {
    q: "Q4. 副業に対する希望は？",
    options: [
      { text: "仕入れ値と売値の差で利益を出したい", scores: {sedori:3} },
      { text: "少額から資金を運用してみたい", scores: {invest:3} },
      { text: "自宅でWeb制作やアプリ開発に挑戦したい", scores: {program:3} },
      { text: "まずはリスクなく軽作業から始めたい", scores: {writing:3} }
    ]
  },
  {
    q: "Q5. 将来目指したい働き方は？",
    options: [
      { text: "専門スキルで手に職をつけたい", scores: {cad:3} },
      { text: "自分の資産（記事・フォロワーなど）を育てたい", scores: {blog:3} },
      { text: "技術力を活かして高単価案件を受注したい", scores: {program:3} },
      { text: "スキマ時間でコツコツ稼ぎたい", scores: {writing:3} }
    ]
  },
  {
    q: "Q6. 性格として近いのは？",
    options: [
      { text: "行動力があり、すぐ動くタイプ", scores: {sedori:3} },
      { text: "冷静にデータや数字を分析するタイプ", scores: {invest:3} },
      { text: "人と関わったり発信するのが好きなタイプ", scores: {sns:3} },
      { text: "発想力・表現力があるタイプ", scores: {video:3} }
    ]
  },
  {
    q: "Q7. 学習にかけられる時間は？",
    options: [
      { text: "3ヶ月以上かけてじっくりスキルを積み上げたい", scores: {cad:3} },
      { text: "行動しながら短期間で結果を出したい", scores: {sedori:3} },
      { text: "発信しながら継続学習していきたい", scores: {sns:3} },
      { text: "1〜2ヶ月で編集スキルを身につけたい", scores: {video:3} }
    ]
  },
  {
    q: "Q8. 初期費用に対する考えは？",
    options: [
      { text: "自分の資産を育てるためコツコツ書いていきたい", scores: {blog:3} },
      { text: "運用資金として用意できる", scores: {invest:3} },
      { text: "動画編集の機材・ソフトに投資してもいい", scores: {video:3} },
      { text: "できるだけ0円で始めたい", scores: {writing:3} }
    ]
  },
  {
    q: "Q9. パソコン作業についてどう感じますか？",
    options: [
      { text: "細かい図面・設計ソフトの操作も苦にならない", scores: {cad:3} },
      { text: "資金を増やすために数字を追うのが好き", scores: {invest:3} },
      { text: "コードを書いて何かを組み立てるのが好き", scores: {program:3} },
      { text: "文章入力やデータ整理は得意", scores: {writing:3} }
    ]
  },
  {
    q: "Q10. 最終的にどんな副業なら続けられそうですか？",
    options: [
      { text: "自分の発信が資産になっていくもの", scores: {blog:3} },
      { text: "リサーチや仕入れ判断で利益を出すもの", scores: {sedori:3} },
      { text: "人とのつながりを活かして発信するもの", scores: {sns:3} },
      { text: "技術力を武器に案件を受注できるもの", scores: {program:3} }
    ]
  }
];

// CAD > ブログ・アフィリエイト > その他 の優先順位のための基礎バイアス（各タイプの素の最大点=15に対して小さめに設定）
const BASE_BIAS = {
  cad: 3,
  blog: 2,
  sedori: 0,
  invest: 0,
  sns: 0,
  video: 0,
  program: 0,
  writing: 0
};

let current = 0;
let lastShareText = '';
const answers = [];
const scores = Object.fromEntries(Object.keys(TYPES).map(k => [k, BASE_BIAS[k] || 0]));

const questionText = document.getElementById('questionText');
const optionsWrap = document.getElementById('optionsWrap');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const backBtn = document.getElementById('backBtn');
const quizScreen = document.getElementById('quizScreen');
const resultScreen = document.getElementById('resultScreen');

function renderQuestion(){
  const item = QUESTIONS[current];
  questionText.textContent = item.q;
  optionsWrap.innerHTML = '';
  item.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt.text;
    btn.addEventListener('click', () => selectOption(idx));
    optionsWrap.appendChild(btn);
  });
  progressFill.style.width = ((current) / QUESTIONS.length * 100) + '%';
  progressLabel.textContent = `質問 ${current + 1} / ${QUESTIONS.length}`;
  backBtn.disabled = current === 0;
}

function selectOption(idx){
  const item = QUESTIONS[current];
  const opt = item.options[idx];
  answers[current] = idx;

  if (answers.length > current + 1) {
    answers.length = current + 1;
  }

  applyScoresFromScratch();

  if (current < QUESTIONS.length - 1) {
    current++;
    renderQuestion();
  } else {
    showResult();
  }
}

function applyScoresFromScratch(){
  Object.keys(scores).forEach(k => scores[k] = BASE_BIAS[k] || 0);
  answers.forEach((ansIdx, qIdx) => {
    if (ansIdx === undefined) return;
    const opt = QUESTIONS[qIdx].options[ansIdx];
    Object.entries(opt.scores).forEach(([type, val]) => {
      scores[type] = (scores[type] || 0) + val;
    });
  });
}

backBtn.addEventListener('click', () => {
  if (current > 0) {
    current--;
    renderQuestion();
  }
});

function showResult(){
  let bestType = 'cad';
  let bestScore = -Infinity;
  Object.entries(scores).forEach(([type, val]) => {
    if (val > bestScore) {
      bestScore = val;
      bestType = type;
    }
  });

  const result = TYPES[bestType];
  document.getElementById('resultTitle').textContent = result.title;
  document.getElementById('resultMatch').textContent = result.match;
  document.getElementById('resultDesc').innerHTML = result.desc;

  // 第2候補は必ずCADかブログ・アフィリエイトのどちらか（1位と異なる方を優先）
  let secondType;
  if (bestType === 'cad') {
    secondType = 'blog';
  } else if (bestType === 'blog') {
    secondType = 'cad';
  } else {
    secondType = scores.cad >= scores.blog ? 'cad' : 'blog';
  }
  const second = TYPES[secondType];
  document.getElementById('secondPickTitle').textContent = second.title;
  document.getElementById('secondPickDesc').innerHTML = second.desc;

  const shareText = `【副業診断結果】\n私にぴったりの副業は「${result.title}」でした！\n第2候補は「${second.title}」でした。\n\nあなたも診断してみよう▶`;
  lastShareText = shareText;

  quizScreen.classList.add('hidden');
  resultScreen.classList.remove('hidden');
  progressFill.style.width = '100%';
  progressLabel.textContent = '診断完了';
}

document.getElementById('retryBtn').addEventListener('click', () => {
  current = 0;
  answers.length = 0;
  applyScoresFromScratch();
  resultScreen.classList.add('hidden');
  quizScreen.classList.remove('hidden');
  renderQuestion();
});

document.getElementById('ctaBtn').addEventListener('click', () => {
  window.location.href = 'https://lin.ee/pwVpuyG';
});

document.getElementById('lineShareBtn').addEventListener('click', () => {
  const shareUrl = window.location.href.split('?')[0].split('#')[0];
  const lineShareLink = 'https://social-plugins.line.me/lineit/share?'
    + 'text=' + encodeURIComponent(lastShareText)
    + '&url=' + encodeURIComponent(shareUrl);
  window.open(lineShareLink, '_blank');
});

renderQuestion();
</script>
</body>
</html>
